<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Login Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f9b0f,#1e3c72);
    }

    .login-container{
      width:350px;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .login-container h2{
      text-align:center;
      color:#0f9b0f;
      margin-bottom:10px;
    }

    .login-container p{
      text-align:center;
      color:gray;
      margin-bottom:30px;
      font-size:14px;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      color:#333;
      font-weight:bold;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      font-size:15px;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:#0f9b0f;
      box-shadow:0 0 5px rgba(15,155,15,0.5);
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      font-size:14px;
    }

    .options a{
      text-decoration:none;
      color:#0f9b0f;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#0f9b0f;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#0c7d0c;
    }

    .register{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .register a{
      color:#0f9b0f;
      text-decoration:none;
      font-weight:bold;
    }

    .message{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      color:red;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h2 id="formTitle">Partner Login</h2>
    <p id="formSubtitle">Login to your VYAT Connect account</p>

    <form id="loginForm">

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn" id="submitBtn">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="register">
      <span id="modeText">Don't have an account?</span>
      <a href="#" id="toggleMode">Register</a>
    </div>

  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from './firebase-config.js';

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const toggleMode = document.getElementById("toggleMode");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const submitBtn = document.getElementById("submitBtn");
    const modeText = document.getElementById("modeText");

    let isLogin = true;

    toggleMode.addEventListener("click", (e) => {
      e.preventDefault();
      isLogin = !isLogin;
      if (isLogin) {
        formTitle.innerText = "Partner Login";
        formSubtitle.innerText = "Login to your VYAT Connect account";
        submitBtn.innerText = "Login";
        modeText.innerText = "Don't have an account?";
        toggleMode.innerText = "Register";
      } else {
        formTitle.innerText = "Partner Registration";
        formSubtitle.innerText = "Create a new VYAT Connect account";
        submitBtn.innerText = "Register";
        modeText.innerText = "Already have an account?";
        toggleMode.innerText = "Login";
      }
      message.innerHTML = "";
    });

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if(email === "" || password === ""){
        message.style.color = "red";
        message.innerHTML = "Please fill in all fields.";
        return;
      }

      message.style.color = "blue";
      message.innerHTML = "Please wait...";

      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, email, password);
          message.style.color = "green";
          message.innerHTML = "Login successful! Redirecting...";
          window.location.href = "dashboard.html";
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          message.style.color = "green";
          message.innerHTML = "Registration successful! Redirecting...";
          window.location.href = "dashboard.html";
        }
      } catch (error) {
        message.style.color = "red";
        // Convert Firebase error code to readable message
        message.innerHTML = "Error: " + error.message;
      }
    });
  </script>

</body>
</html>
